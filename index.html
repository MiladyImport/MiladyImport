<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MILADY IMPORT - Tienda</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    
    .card-product { background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    
    /* Layout Galería Estilo Falabella */
    .gallery-layout { display: flex; gap: 10px; height: 350px; margin-bottom: 12px; }
    .thumbnails-sidebar { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; width: 60px; }
    .thumb-img { width: 50px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; cursor: pointer; opacity: 0.6; }
    .thumb-img.active, .thumb-img:hover { opacity: 1; border-color: #000; }
    .main-image-container { flex: 1; position: relative; }
    .main-image { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
    
    .product-title { font-size: 1.1em; font-weight: bold; margin: 5px 0; }
    .product-price { font-size: 1.3em; color: #d90429; font-weight: bold; margin-bottom: 10px; }
    
    /* Muestras de Colores */
    .color-swatches { display: flex; gap: 8px; margin: 10px 0; }
    .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; outline: 1px solid #ccc; cursor: pointer; transition: transform 0.2s; }
    .swatch.selected { outline: 2px solid #000; transform: scale(1.1); }
    
    /* Opciones */
    .options-row { display: flex; gap: 10px; margin-top: 10px; }
    select, input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .btn-buy { width: 100%; background: #111; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 12px; }
    .btn-buy:hover { background: #d90429; }
  </style>
</head>
<body>

  <div id="catalog" class="catalog-grid">Cargando productos...</div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw2xukRqOSqU-CIrna8cEQWV_NTyS2_E1YLz6fa9aksTHBRs9H0QDz6_NKJjf-Hl5vGbA/exec";
    let CATALOGO = [];

    async function cargarCatalogo() {
      try {
        const res = await fetch(API_URL);
        CATALOGO = await res.json();
        renderizar();
      } catch (e) {
        document.getElementById('catalog').innerText = "Error cargando datos.";
      }
    }

    function renderizar() {
      const contenedor = document.getElementById('catalog');
      contenedor.innerHTML = CATALOGO.map(p => {
        const nombresColores = Object.keys(p.colores);
        const primerColor = nombresColores[0] || null;
        
        return `
          <div class="card-product" id="card-${p.id}">
            <div class="gallery-layout">
              <div class="thumbnails-sidebar" id="thumbs-${p.id}">
                <!-- Miniaturas dinámicas -->
              </div>
              <div class="main-image-container">
                <img id="main-img-${p.id}" src="${p.fotoPrincipal}" class="main-image">
              </div>
            </div>

            <div class="product-title">${p.nombre}</div>
            <div class="product-price">S/ ${p.precio.toFixed(2)}</div>
            
            <label style="font-size:0.8em; font-weight:bold;">COLOR:</label>
            <div class="color-swatches">
              ${nombresColores.map(c => `
                <div class="swatch" 
                     style="background-color: ${p.colores[c].hex}" 
                     title="${c}"
                     onclick="seleccionarColor('${p.id}', '${c}', this)">
                </div>
              `).join('')}
            </div>

            <div class="options-row">
              <div style="flex: 2;">
                <label style="font-size:0.8em; font-weight:bold;">TALLA:</label>
                <select id="talla-${p.id}"></select>
              </div>
              <div style="flex: 1;">
                <label style="font-size:0.8em; font-weight:bold;">CANT:</label>
                <input type="number" id="cant-${p.id}" value="1" min="1">
              </div>
            </div>

            <button class="btn-buy" onclick="agregarCarrito('${p.id}')">Agregar al Carrito</button>
          </div>
        `;
      }).join('');

      // Inicializar cada card con su primer color disponible
      CATALOGO.forEach(p => {
        const primerColor = Object.keys(p.colores)[0];
        if (primerColor) {
          const primerSwatch = document.querySelector(`#card-${p.id} .swatch`);
          seleccionarColor(p.id, primerColor, primerSwatch);
        }
      });
    }

    function seleccionarColor(idProducto, nombreColor, elementoSwatch) {
      const prod = CATALOGO.find(p => p.id === idProducto);
      const datosColor = prod.colores[nombreColor];

      // 1. Marcar color activo
      document.querySelectorAll(`#card-${idProducto} .swatch`).forEach(s => s.classList.remove('selected'));
      if(elementoSwatch) elementoSwatch.classList.add('selected');

      // 2. Cargar pool de fotos para ese color
      const contenedorThumbs = document.getElementById(`thumbs-${idProducto}`);
      const mainImg = document.getElementById(`main-img-${idProducto}`);
      
      const fotosPool = (datosColor.fotos && datosColor.fotos.length > 0) 
                         ? datosColor.fotos 
                         : [prod.fotoPrincipal];

      mainImg.src = fotosPool[0]; // Mostrar la primera del pool

      contenedorThumbs.innerHTML = fotosPool.map((f, idx) => `
        <img src="${f}" class="thumb-img ${idx === 0 ? 'active' : ''}" 
             onclick="cambiarFotoPrincipal('${idProducto}', '${f}', this)">
      `).join('');

      // 3. Cargar tallas disponibles para este color
      const selectTalla = document.getElementById(`talla-${idProducto}`);
      selectTalla.innerHTML = datosColor.tallas.map(t => `
        <option value="${t.talla}" ${t.stock <= 0 ? 'disabled' : ''}>
          ${t.talla} ${t.stock <= 0 ? '(Agotado)' : ''}
        </option>
      `).join('');
    }

    function cambiarFotoPrincipal(idProducto, urlFoto, elementoThumb) {
      document.getElementById(`main-img-${idProducto}`).src = urlFoto;
      document.querySelectorAll(`#thumbs-${idProducto} .thumb-img`).forEach(t => t.classList.remove('active'));
      elementoThumb.classList.add('active');
    }

    function agregarCarrito(idProducto) {
      const prod = CATALOGO.find(p => p.id === idProducto);
      const colorActivo = document.querySelector(`#card-${idProducto} .swatch.selected`).title;
      const tallaActiva = document.getElementById(`talla-${idProducto}`).value;
      const cantidad = parseInt(document.getElementById(`cant-${idProducto}`).value) || 1;

      alert(`Añadido: ${prod.nombre}\nColor: ${colorActivo}\nTalla: ${tallaActiva}\nCantidad: ${cantidad}`);
    }

    window.onload = cargarCatalogo;
  </script>
</body>
</html>
