<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MILADY IMPORT - Catálogo de Productos</title>
  <style>
    :root {
      --primary: #d90429;
      --dark: #111;
      --light: #f8f9fa;
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
    header { background: var(--dark); color: white; text-align: center; padding: 20px 10px; border-bottom: 4px solid var(--primary); }
    header h1 { margin: 0; font-size: 2em; letter-spacing: 2px; }
    header p { margin: 5px 0 0; color: #ccc; }
    .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
    .title-section { text-align: center; font-size: 1.8em; margin-bottom: 25px; text-transform: uppercase; }
    
    .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card-producto { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; transition: transform 0.2s; }
    .card-producto:hover { transform: translateY(-3px); }
    
    .gallery-container { width: 100%; height: 300px; background: #eee; position: relative; }
    .main-img { width: 100%; height: 100%; object-fit: cover; }
    
    .card-body { padding: 15px; }
    .card-code { font-size: 0.8em; color: #777; font-weight: bold; }
    .card-title { font-size: 1.2em; font-weight: bold; margin: 5px 0; }
    .card-price { font-size: 1.3em; color: var(--primary); font-weight: bold; margin-bottom: 10px; }
    
    .form-option { display: flex; gap: 10px; margin-bottom: 15px; }
    .form-option div { flex: 1; }
    .form-option label { font-size: 0.8em; font-weight: bold; display: block; margin-bottom: 3px; }
    .card-select, .card-input { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    
    .btn-add-cart { width: 100%; background: var(--dark); color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-add-cart:hover { background: var(--primary); }
    
    .badge-agotado { position: absolute; top: 10px; right: 10px; background: red; color: white; padding: 4px 8px; font-size: 0.8em; border-radius: 4px; font-weight: bold; z-index: 2; }
    .loading, .error-msg { text-align: center; font-size: 1.2em; padding: 40px; }
    .error-msg { color: red; }
  </style>
</head>
<body>

  <header>
    <h1>MILADY IMPORT</h1>
    <p>Ropa Deportiva & Importaciones</p>
  </header>

  <div class="container">
    <h2 class="title-section">Catálogo de Productos</h2>
    <div id="contenedorProductos" class="loading">Cargando inventario...</div>
  </div>

  <script>
    // URL de tu ejecutable de Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbw2xukRqOSqU-CIrna8cEQWV_NTyS2_E1YLz6fa9aksTHBRs9H0QDz6_NKJjf-Hl5vGbA/exec"; 
    let CATALOGO = [];
    let carrito = [];

    async function cargarInventario() {
      const contenedor = document.getElementById("contenedorProductos");
      try {
        const respuesta = await fetch(API_URL);
        if (!respuesta.ok) throw new Error("Error en la respuesta del servidor");
        
        CATALOGO = await respuesta.json();
        renderizarCatalogo();
      } catch (error) {
        console.error(error);
        contenedor.className = "error-msg";
        contenedor.innerHTML = "Error al obtener los datos del inventario. Por favor, verifica la configuración del Spreadsheet.";
      }
    }

    function renderizarCatalogo() {
      const contenedor = document.getElementById("contenedorProductos");
      contenedor.className = "grid-productos";

      if (!CATALOGO || CATALOGO.length === 0) {
        contenedor.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>No hay productos registrados en el inventario.</p>";
        return;
      }

      contenedor.innerHTML = CATALOGO.map(p => {
        const sinStock = p.stockTotal <= 0;
        const tallasUnicas = [...new Set(p.variaciones.map(v => v.talla))];
        const coloresUnicos = [...new Set(p.variaciones.map(v => v.color))];
        
        // Imagen por defecto (primera variación válida)
        const primeraFoto = p.fotos[0] || 'https://via.placeholder.com/300?text=Sin+Imagen';

        return `
          <div class="card-producto">
            ${sinStock ? '<span class="badge-agotado">AGOTADO</span>' : ''}
            
            <div class="gallery-container">
              <img id="img-${p.id}" src="${primeraFoto}" class="main-img" alt="${p.nombre}">
            </div>

            <div class="card-body">
              <div class="card-code">CÓDIGO: ${p.id}</div>
              <div class="card-title">${p.nombre}</div>
              <div class="card-price">S/. ${p.precio.toFixed(2)}</div>
              
              <div class="form-option">
                <div>
                  <label>Talla:</label>
                  <select id="talla-${p.id}" class="card-select" onchange="actualizarFotoYStock('${p.id}')" ${sinStock ? 'disabled' : ''}>
                    ${tallasUnicas.map(t => `<option value="${t}">${t}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label>Color:</label>
                  <select id="color-${p.id}" class="card-select" onchange="actualizarFotoYStock('${p.id}')" ${sinStock ? 'disabled' : ''}>
                    ${coloresUnicos.map(c => `<option value="${c}">${c}</option>`).join('')}
                  </select>
                </div>
                <div style="flex:0.6;">
                  <label>Cant:</label>
                  <input type="number" id="cant-${p.id}" class="card-input" value="1" min="1" ${sinStock ? 'disabled' : ''}>
                </div>
              </div>

              <button class="btn-add-cart" 
                      ${sinStock ? 'disabled style="background:#ccc; cursor:not-allowed;"' : ''} 
                      onclick="agregarAlCarrito('${p.id}')">
                ${sinStock ? 'Agotado' : 'Agregar al Carrito'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Actualiza la imagen automáticamente cuando el usuario cambia la Talla o Color
    function actualizarFotoYStock(idProducto) {
      const prod = CATALOGO.find(p => p.id === idProducto);
      const tallaSelec = document.getElementById(`talla-${idProducto}`).value;
      const colorSelec = document.getElementById(`color-${idProducto}`).value;

      const variante = prod.variaciones.find(v => v.talla === tallaSelec && v.color === colorSelec);

      if (variante && variante.fotos && variante.fotos.length > 0) {
        document.getElementById(`img-${idProducto}`).src = variante.fotos[0];
      }
    }

    function agregarAlCarrito(idProducto) {
      const prod = CATALOGO.find(p => p.id === idProducto);
      const talla = document.getElementById(`talla-${idProducto}`).value;
      const color = document.getElementById(`color-${idProducto}`).value;
      const cantidad = parseInt(document.getElementById(`cant-${idProducto}`).value) || 1;

      const variante = prod.variaciones.find(v => v.talla === talla && v.color === color);
      const stockDisponible = variante ? variante.stock : 0;

      if (stockDisponible <= 0) {
        alert("La combinación de Talla y Color seleccionada no cuenta con stock.");
        return;
      }

      if (cantidad > stockDisponible) {
        alert(`Solo quedan ${stockDisponible} unidades de la Talla ${talla} / Color ${color}.`);
        return;
      }

      carrito.push({
        id: prod.id,
        nombre: prod.nombre,
        precio: prod.precio,
        talla: talla,
        color: color,
        cantidad: cantidad
      });

      alert(`Añadido al carrito: ${prod.nombre} (${talla} - ${color}) x${cantidad}`);
    }

    window.onload = cargarInventario;
  </script>
</body>
</html>
